<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | SMS</title>
  <meta name="theme-color" content="#f4f3ef" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2" />
  <script src="../js/core/preferences.js?v=global-prefs-1"></script>
  <script>
    (function () {
      try {
        if (window.AppPreferences) {
          const theme = AppPreferences.initTheme("login");
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#050505" : "#f4f3ef");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/posts.css?v=login-i18n-1">
  <link rel="stylesheet" href="../css/login.css?v=login-executive-3d-1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="login-experience" aria-hidden="true">
    <canvas id="login-three-canvas" class="login-three-canvas"></canvas>
    <canvas id="login-code-canvas" class="login-code-canvas"></canvas>
    <div class="login-depth-grid"></div>
    <div class="login-scanline"></div>
  </div>

  <main class="login-shell">
    <section class="login-auth-panel" aria-labelledby="login-title">
      <div class="login-panel-toolbar">
        <div class="login-toolbar-actions">
          <label class="login-language-control">
            <span data-i18n="login.language.label">Language</span>
            <select id="login-language-select" data-i18n-aria-label="login.language.select" aria-label="Choose language"></select>
          </label>
          <button type="button" class="login-theme-toggle" id="login-theme-toggle" aria-pressed="false">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/>
              <path d="M12 20v2"/>
              <path d="M4.93 4.93 6.34 6.34"/>
              <path d="M17.66 17.66 19.07 19.07"/>
              <path d="M2 12h2"/>
              <path d="M20 12h2"/>
              <path d="M6.34 17.66 4.93 19.07"/>
              <path d="M19.07 4.93 17.66 6.34"/>
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
            </svg>
            <span id="login-theme-label"></span>
          </button>
        </div>
      </div>

      <div class="login-brand">
        <div class="login-emblem" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 21 32 12l18 9-18 9-18-9Z"/>
            <path d="M22 29v10c5.6 4.1 14.4 4.1 20 0V29"/>
            <path d="M50 22v14"/>
            <path d="M20 49h24"/>
          </svg>
        </div>
        <div>
          <p class="login-kicker" data-i18n="login.brand.kicker">SMS</p>
          <h1 id="login-title" data-i18n="login.brand.title">SMS</h1>
        </div>
      </div>

      <div class="login-card">
        <div class="login-card-head">
          <h2 data-i18n="login.form.title">Login</h2>
          <p data-i18n="login.form.subtitle">Access your workspace according to your account permissions.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="username" data-i18n="login.form.username">Username</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                data-i18n-placeholder="login.form.usernamePlaceholder"
                placeholder="username"
                required
                autocomplete="username"
              />
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </span>
            </div>
          </div>

          <div class="field-group">
            <label for="password" data-i18n="login.form.password">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="********"
                required
                autocomplete="current-password"
              />
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="11" width="14" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                  <path d="M12 16v2"/>
                </svg>
              </span>
            </div>
          </div>

          <button type="submit" id="login-btn">
            <span data-i18n="login.form.submit">Login</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>
          </button>
        </form>

        <div id="error-msg" role="alert" aria-live="polite"></div>
      </div>

      <p class="login-footer" data-i18n="login.footer">All rights reserved © 2026 - School Management System</p>
    </section>

    <section class="login-posts-panel" aria-labelledby="posts-title">
      <div class="posts-panel-head">
        <div>
          <p class="login-kicker" data-i18n="login.posts.kicker">School Announcements</p>
          <h2 id="posts-title" data-i18n="login.posts.title">Latest Posts</h2>
        </div>
        <button type="button" class="posts-refresh-btn" id="posts-refresh-btn" data-i18n-title="login.posts.refresh" data-i18n-aria-label="login.posts.refresh" title="Refresh posts" aria-label="Refresh posts">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 0 1-15.2 6.5L3 16"/>
            <path d="M3 16h5v5"/>
            <path d="M3 12A9 9 0 0 1 18.2 5.5L21 8"/>
            <path d="M21 8h-5V3"/>
          </svg>
        </button>
      </div>

      <div id="login-posts-status" class="posts-status" data-i18n="login.posts.loading">Loading posts...</div>
      <div class="login-cinema-stage" id="login-cinema-stage">
        <button type="button" class="login-cinema-arrow login-cinema-arrow-prev" data-posts-shift="-1" data-i18n-aria-label="login.posts.previous" aria-label="Previous posts">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6 9 12l6 6"/>
          </svg>
        </button>
        <div id="login-posts-list" class="login-posts-content" aria-live="polite" tabindex="0"></div>
        <button type="button" class="login-cinema-arrow login-cinema-arrow-next" data-posts-shift="1" data-i18n-aria-label="login.posts.next" aria-label="Next posts">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 6 6 6-6 6"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <div id="login-post-modal" class="login-post-modal" hidden>
    <div class="login-post-modal-card" role="dialog" aria-modal="true" aria-labelledby="login-post-modal-title">
      <button type="button" class="modal-close-btn" id="login-post-modal-close" data-i18n-aria-label="login.common.close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
      <div id="login-post-modal-content"></div>
    </div>
  </div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/i18n.js?v=global-prefs-1"></script>
  <script>
    (async function () {
      if (Auth.isAuthenticated()) {
        const session = Auth.getSession();
        Router.redirectToDashboard(session.role);
        return;
      }

      if (window.I18n) {
        await I18n.init({ scope: "login", defaultLang: "ar" });
      }

      const form = document.getElementById("login-form");
      const errorMsg = document.getElementById("error-msg");
      const loginBtn = document.getElementById("login-btn");
      const loginBtnLabel = loginBtn?.querySelector("span");
      const postsList = document.getElementById("login-posts-list");
      const postsStage = document.getElementById("login-cinema-stage");
      const postsStatus = document.getElementById("login-posts-status");
      const refreshBtn = document.getElementById("posts-refresh-btn");
      const themeToggle = document.getElementById("login-theme-toggle");
      const themeLabel = document.getElementById("login-theme-label");
      const languageSelect = document.getElementById("login-language-select");
      const postModal = document.getElementById("login-post-modal");
      const postModalContent = document.getElementById("login-post-modal-content");
      const postModalClose = document.getElementById("login-post-modal-close");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      let postsCache = [];
      let postsScrollFrame = 0;
      let postsDragState = null;
      let suppressPostOpenUntil = 0;
      const loginExperience = initLoginExperience();

      function t(key, params = {}, fallback = "") {
        return window.I18n ? I18n.t(key, params, fallback || key) : (fallback || key);
      }

      function initLoginExperience() {
        const root = document.documentElement;
        const threeCanvas = document.getElementById("login-three-canvas");
        const codeCanvas = document.getElementById("login-code-canvas");
        const codeContext = codeCanvas?.getContext("2d", { alpha: true });
        const pointer = { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5, nx: 0, ny: 0 };
        const state = {
          focusEnergy: 0,
          typingEnergy: 0,
          pointerEnergy: 0,
          bursts: []
        };
        const snippets = [
          "const session = await Auth.login(user, pass);",
          "Router.redirectToDashboard(role);",
          "SELECT role_name FROM users WHERE active = 1;",
          "SMS.secure.token.rotate();",
          "permission.scope.resolve(user.role);",
          "POST /users/login 200 OK",
          "hash.verify(credentials);",
          "dashboard.mount(workspace);",
          "i18n.setLanguage(locale);",
          "audit.log('login_attempt');"
        ];

        function setPointer(event) {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.nx = (event.clientX / Math.max(window.innerWidth, 1)) * 2 - 1;
          pointer.ny = (event.clientY / Math.max(window.innerHeight, 1)) * 2 - 1;
          state.pointerEnergy = Math.min(1, state.pointerEnergy + 0.08);
          root.style.setProperty("--login-pointer-x", `${event.clientX}px`);
          root.style.setProperty("--login-pointer-y", `${event.clientY}px`);
          root.style.setProperty("--login-tilt-x", `${(-pointer.ny * 2.2).toFixed(2)}deg`);
          root.style.setProperty("--login-tilt-y", `${(pointer.nx * 2.8).toFixed(2)}deg`);
        }

        function randomSnippet() {
          return snippets[Math.floor(Math.random() * snippets.length)];
        }

        function addBurst(target, label = "") {
          const rect = target?.getBoundingClientRect?.();
          const originX = rect ? rect.left + rect.width * 0.5 : pointer.x;
          const originY = rect ? rect.top + rect.height * 0.5 : pointer.y;
          state.typingEnergy = Math.min(1, state.typingEnergy + 0.22);
          state.bursts.push({
            x: originX + (Math.random() - 0.5) * 48,
            y: originY + (Math.random() - 0.5) * 22,
            text: label || randomSnippet(),
            life: 1,
            vx: (Math.random() - 0.5) * 1.8,
            vy: -1.6 - Math.random() * 1.4
          });
          if (state.bursts.length > 34) state.bursts.splice(0, state.bursts.length - 34);
          document.body.classList.add("login-typing");
          clearTimeout(addBurst.timer);
          addBurst.timer = setTimeout(() => document.body.classList.remove("login-typing"), 260);
        }

        function startCodeRain() {
          if (!codeCanvas || !codeContext) return;

          let width = 0;
          let height = 0;
          let drops = [];
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const columnWidth = 28;

          function resize() {
            width = Math.floor(window.innerWidth);
            height = Math.floor(window.innerHeight);
            codeCanvas.width = Math.floor(width * dpr);
            codeCanvas.height = Math.floor(height * dpr);
            codeCanvas.style.width = `${width}px`;
            codeCanvas.style.height = `${height}px`;
            codeContext.setTransform(dpr, 0, 0, dpr, 0, 0);
            const count = Math.ceil(width / columnWidth) + 6;
            drops = Array.from({ length: count }, (_, index) => ({
              x: index * columnWidth + Math.random() * 24,
              y: Math.random() * height,
              speed: 0.45 + Math.random() * 1.4,
              text: randomSnippet(),
              size: 10 + Math.random() * 6,
              phase: Math.random() * Math.PI * 2,
              delay: Math.random() * 80
            }));
          }

          function draw(now) {
            codeContext.clearRect(0, 0, width, height);
            codeContext.textBaseline = "top";

            const dark = document.documentElement.dataset.theme === "dark";
            drops.forEach((drop, index) => {
              const dx = drop.x - pointer.x;
              const dy = drop.y - pointer.y;
              const distance = Math.hypot(dx, dy);
              const repel = Math.max(0, 1 - distance / 180) * (20 + state.pointerEnergy * 44);
              const wave = Math.sin(now * 0.0012 + drop.phase) * 12;
              const x = drop.x + wave + (dx / Math.max(distance, 1)) * repel;
              const y = drop.y + (dy / Math.max(distance, 1)) * repel * 0.35;
              const alpha = Math.min(0.9, 0.16 + state.focusEnergy * 0.18 + state.typingEnergy * 0.26 + (index % 5) * 0.035);
              codeContext.font = `${drop.size}px "Consolas", "Cascadia Code", monospace`;
              codeContext.fillStyle = dark
                ? `rgba(245, 245, 242, ${alpha * 0.62})`
                : `rgba(18, 18, 18, ${alpha * 0.58})`;
              codeContext.fillText(drop.text, x, y);
              codeContext.fillStyle = dark
                ? `rgba(245, 245, 242, ${alpha * 0.24})`
                : `rgba(18, 18, 18, ${alpha * 0.18})`;
              codeContext.fillText(drop.text.slice(0, Math.max(5, Math.floor(drop.text.length * 0.24))), x, y);

              drop.y += drop.speed * (1 + state.typingEnergy * 1.8);
              if (drop.y > height + 42 || drop.delay > 0) {
                if (drop.y > height + 42) {
                  drop.y = -30 - Math.random() * height * 0.3;
                  drop.x = (index * columnWidth + Math.random() * 42) % (width + 80);
                  drop.text = randomSnippet();
                  drop.speed = 0.45 + Math.random() * 1.5;
                } else {
                  drop.delay -= 1;
                }
              }
            });

            state.bursts.forEach(burst => {
              codeContext.font = `700 ${12 + (1 - burst.life) * 8}px "Consolas", "Cascadia Code", monospace`;
              codeContext.fillStyle = dark
                ? `rgba(255, 255, 255, ${Math.max(0, burst.life) * 0.82})`
                : `rgba(0, 0, 0, ${Math.max(0, burst.life) * 0.72})`;
              codeContext.fillText(burst.text, burst.x, burst.y);
              burst.x += burst.vx;
              burst.y += burst.vy;
              burst.life -= 0.018;
            });
            state.bursts = state.bursts.filter(burst => burst.life > 0);

            state.typingEnergy *= 0.94;
            state.pointerEnergy *= 0.92;
            requestAnimationFrame(draw);
          }

          resize();
          window.addEventListener("resize", resize, { passive: true });
          requestAnimationFrame(draw);
        }

        function startThreeScene() {
          if (!threeCanvas) return;
          if (!window.THREE) {
            startFallbackConstellation();
            return;
          }

          const THREE = window.THREE;
          const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
          const group = new THREE.Group();
          const particleGroup = new THREE.Group();
          const coreGeometry = new THREE.IcosahedronGeometry(2.45, 2);
          const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x111111,
            wireframe: true,
            transparent: true,
            opacity: 0.16
          });
          const core = new THREE.Mesh(coreGeometry, coreMaterial);
          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(coreGeometry),
            new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.22 })
          );
          const positions = [];
          const colors = [];
          const colorA = new THREE.Color(0x111111);
          const colorB = new THREE.Color(0x57534e);
          const colorC = new THREE.Color(0xa8a29e);

          for (let i = 0; i < 760; i += 1) {
            const angle = i * 0.37;
            const radius = 2.6 + Math.sin(i * 0.19) * 0.55 + Math.random() * 1.8;
            const y = (Math.random() - 0.5) * 4.4;
            positions.push(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
            const mixed = i % 3 === 0 ? colorC : (i % 2 === 0 ? colorA : colorB);
            colors.push(mixed.r, mixed.g, mixed.b);
          }

          const pointsGeometry = new THREE.BufferGeometry();
          pointsGeometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
          pointsGeometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
          const points = new THREE.Points(
            pointsGeometry,
            new THREE.PointsMaterial({
              size: 0.035,
              color: 0x111111,
              vertexColors: false,
              transparent: true,
              opacity: 0.78,
              depthWrite: false
            })
          );

          group.add(core);
          group.add(edges);
          particleGroup.add(points);
          scene.add(group);
          scene.add(particleGroup);
          camera.position.set(0, 0.1, 8.2);

          function resize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(width, height, false);
            camera.aspect = width / Math.max(height, 1);
            camera.updateProjectionMatrix();
          }

          function animate(now) {
            const time = now * 0.001;
            const dark = document.documentElement.dataset.theme === "dark";
            const pulse = 1 + state.typingEnergy * 0.16 + state.focusEnergy * 0.04;
            coreMaterial.color.setHex(dark ? 0xf5f5f2 : 0x111111);
            edges.material.color.setHex(dark ? 0xf5f5f2 : 0x111111);
            points.material.color.setHex(dark ? 0xf5f5f2 : 0x111111);
            group.scale.setScalar(pulse);
            group.rotation.x = time * 0.16 + pointer.ny * 0.22;
            group.rotation.y = time * 0.22 + pointer.nx * 0.28;
            group.rotation.z = Math.sin(time * 0.4) * 0.08;
            particleGroup.rotation.y = -time * 0.08 + pointer.nx * 0.16;
            particleGroup.rotation.x = time * 0.035 + pointer.ny * 0.12;
            coreMaterial.opacity = 0.14 + state.typingEnergy * 0.14 + state.focusEnergy * 0.05;
            edges.material.opacity = 0.24 + state.typingEnergy * 0.22;
            points.material.opacity = 0.52 + state.typingEnergy * 0.32 + state.focusEnergy * 0.08;
            camera.position.x += (pointer.nx * 0.38 - camera.position.x) * 0.035;
            camera.position.y += (-pointer.ny * 0.24 - camera.position.y) * 0.035;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
          }

          resize();
          window.addEventListener("resize", resize, { passive: true });
          requestAnimationFrame(animate);
        }

        function startFallbackConstellation() {
          const ctx = threeCanvas?.getContext("2d", { alpha: true });
          if (!threeCanvas || !ctx) return;
          let width = 0;
          let height = 0;
          let points = [];
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            threeCanvas.width = Math.floor(width * dpr);
            threeCanvas.height = Math.floor(height * dpr);
            threeCanvas.style.width = `${width}px`;
            threeCanvas.style.height = `${height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            points = Array.from({ length: 180 }, () => ({
              a: Math.random() * Math.PI * 2,
              r: 90 + Math.random() * Math.min(width, height) * 0.38,
              z: Math.random() * Math.PI * 2
            }));
          }

          function draw(now) {
            ctx.clearRect(0, 0, width, height);
            const cx = width * 0.62 + pointer.nx * 35;
            const cy = height * 0.42 + pointer.ny * 30;
            points.forEach((point, index) => {
              const depth = 0.65 + Math.sin(now * 0.0008 + point.z) * 0.35;
              const x = cx + Math.cos(point.a + now * 0.00018) * point.r * depth;
              const y = cy + Math.sin(point.a + now * 0.00024) * point.r * depth * 0.42;
              const dark = document.documentElement.dataset.theme === "dark";
              ctx.fillStyle = dark
                ? (index % 5 === 0 ? "rgba(255, 255, 255, .34)" : "rgba(255, 255, 255, .2)")
                : (index % 5 === 0 ? "rgba(0, 0, 0, .24)" : "rgba(0, 0, 0, .16)");
              ctx.beginPath();
              ctx.arc(x, y, 1.2 + state.typingEnergy * 2.8, 0, Math.PI * 2);
              ctx.fill();
            });
            requestAnimationFrame(draw);
          }

          resize();
          window.addEventListener("resize", resize, { passive: true });
          requestAnimationFrame(draw);
        }

        document.addEventListener("pointermove", setPointer, { passive: true });
        document.addEventListener("keydown", event => {
          if (event.key === "Tab" || event.key === "Shift") return;
          addBurst(document.activeElement, "auth.signal()");
        });
        [usernameInput, passwordInput].forEach(input => {
          input?.addEventListener("focus", () => {
            state.focusEnergy = 1;
            addBurst(input, input === passwordInput ? "hash.verify()" : "identity.resolve()");
          });
          input?.addEventListener("blur", () => {
            state.focusEnergy = 0;
          });
          input?.addEventListener("input", () => addBurst(input, input === passwordInput ? "password.hash(*)" : "user.lookup()"));
        });

        startCodeRain();
        let threeBooted = false;
        const bootThreeExperience = () => {
          if (threeBooted) return;
          threeBooted = true;
          let tries = 0;
          const waitForThree = () => {
            if (window.THREE || tries > 24) {
              startThreeScene();
              return;
            }
            tries += 1;
            setTimeout(waitForThree, 120);
          };
          waitForThree();
        };
        window.addEventListener("load", bootThreeExperience);
        setTimeout(bootThreeExperience, 1800);

        return {
          pulse(target, label) {
            addBurst(target, label);
          }
        };
      }

      function locale() {
        return window.I18n ? I18n.get("meta.locale", I18n.currentLang === "ar" ? "ar-DZ" : "en-US") : "ar-DZ";
      }

      function renderLanguageSelect() {
        if (!languageSelect || !window.I18n) return;
        languageSelect.innerHTML = I18n.getLanguages().map(lang => `
          <option value="${escapeAttr(lang.code)}" dir="${escapeAttr(lang.dir || "auto")}" ${lang.code === I18n.currentLang ? "selected" : ""}>
            ${escapeHtml(lang.label)}
          </option>
        `).join("");
      }

      function setLoginTheme(theme) {
        const nextTheme = window.AppPreferences
          ? AppPreferences.applyTheme(theme, { scope: "login", persist: true })
          : (theme === "dark" ? "dark" : "light");
        if (!window.AppPreferences) {
          document.documentElement.dataset.theme = nextTheme;
          document.body.dataset.theme = nextTheme;
          localStorage.setItem("sms-theme", nextTheme);
          localStorage.setItem("login-theme", nextTheme);
        }
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", nextTheme === "dark" ? "#050505" : "#f4f3ef");
        themeToggle?.setAttribute("aria-pressed", String(nextTheme === "dark"));
        if (themeLabel) {
          themeLabel.textContent = nextTheme === "dark"
            ? t("login.theme.dark", {}, "Dark mode")
            : t("login.theme.light", {}, "Light mode");
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function stripMarkdown(value) {
        return String(value || "")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/!\[[^\]]*\]\([^)]+\)/g, " ")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/[#>*_`~|$\\-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function getFileIcon(ext) {
        return ext ? String(ext).toUpperCase().slice(0, 4) : t("login.common.file", {}, "File");
      }

      function processPostMarkdown(raw) {
        if (!raw) return "";

        const downloadWords = ["\\u062a\\u062d\\u0645\\u064a\\u0644", "Download", "Telecharger", "Telechargement"];
        const downloadPattern = new RegExp(`\\[(?:${downloadWords.join("|")}):\\s*([^\\]|]+?)(?:\\|([^\\]|]*?))?(?:\\|([^\\]]*?))?\\]\\(([^)]+)\\)`, "g");
        let source = String(raw).replace(downloadPattern, (_, name, type, size, url) => {
          const safeUrl = escapeAttr(url.trim());
          const safeName = escapeHtml(name.trim());
          const ext = safeUrl.split(".").pop()?.split("?")[0];
          const icon = getFileIcon(ext);
          const meta = [type, size].map(part => part?.trim()).filter(Boolean).join(" - ");

          return `
            <a href="${safeUrl}" target="_blank" class="dl-card" rel="noopener noreferrer">
              <span class="dl-card-icon">${icon}</span>
              <span class="dl-card-info">
                <span class="dl-card-name">${safeName}</span>
                ${meta ? `<span class="dl-card-meta">${escapeHtml(meta)}</span>` : ""}
              </span>
              <span class="dl-card-btn">${t("login.common.download", {}, "Download")}</span>
            </a>
          `;
        });

        let html = typeof marked !== "undefined"
          ? marked.parse(source, { gfm: true, breaks: true, tables: true })
          : escapeHtml(source).replace(/\n/g, "<br>");

        if (typeof DOMPurify !== "undefined") {
          html = DOMPurify.sanitize(html, {
            ADD_ATTR: ["target", "rel", "class"]
          });
        }

        return html;
      }

      function typesetMath(container, attempt = 0) {
        if (!container || typeof MathJax === "undefined") return;

        if (MathJax.typesetPromise) {
          if (MathJax.typesetClear) MathJax.typesetClear([container]);
          MathJax.typesetPromise([container]).catch(() => {});
          return;
        }

        if (MathJax.startup?.promise) {
          MathJax.startup.promise.then(() => typesetMath(container, attempt + 1)).catch(() => {});
          return;
        }

        if (attempt < 8) {
          setTimeout(() => typesetMath(container, attempt + 1), 250);
        }
      }

      function resolveMediaUrl(url) {
        const value = String(url || "").trim();
        if (!value) return "";
        if (/^(https?:|data:|blob:)/i.test(value)) return value;
        if (value.startsWith("/")) return `${API_BASE_URL}${value}`;
        return value;
      }

      function formatDate(value) {
        if (!value) return t("login.common.unknownDate", {}, "Unknown date");
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return t("login.common.unknownDate", {}, "Unknown date");
        return date.toLocaleDateString(locale(), { year: "numeric", month: "long", day: "numeric" });
      }

      function getPostsArray(response) {
        if (Array.isArray(response)) return response;
        if (Array.isArray(response?.data)) return response.data;
        return [];
      }

      function renderEmptyPosts(message) {
        postsList.innerHTML = "";
        postsStage?.classList.remove("has-posts", "is-scrollable");
        postsList.classList.remove("is-dragging");
        postsStatus.textContent = message;
        postsStatus.classList.remove("is-hidden");
      }

      function schedulePostsScrollScene() {
        if (postsScrollFrame) return;
        postsScrollFrame = requestAnimationFrame(() => {
          postsScrollFrame = 0;
          updatePostsScrollScene();
        });
      }

      function updatePostsScrollScene() {
        const cards = [...postsList.querySelectorAll(".login-post-list-card")];
        postsStage?.classList.toggle("is-scrollable", postsList.scrollWidth > postsList.clientWidth + 6);
        if (!cards.length) return;

        const listRect = postsList.getBoundingClientRect();
        const center = listRect.left + listRect.width * 0.5;
        const maxDistance = Math.max(listRect.width * 0.46, 260);
        const direction = document.documentElement.dir === "rtl" ? -1 : 1;

        cards.forEach((card, index) => {
          const rect = card.getBoundingClientRect();
          const cardCenter = rect.left + rect.width * 0.5;
          const offset = Math.max(-1.45, Math.min(1.45, (cardCenter - center) / maxDistance));
          const distance = Math.min(1, Math.abs(offset));
          const presence = 1 - distance;
          const depth = Math.round(presence * 132 - 58);
          const rotateX = (Math.abs(offset) * -4.5).toFixed(2);
          const rotateY = (-offset * direction * 24).toFixed(2);
          const scale = (0.86 + presence * 0.14).toFixed(3);
          const opacity = (0.48 + presence * 0.52).toFixed(3);
          const lift = (-presence * 8).toFixed(2);
          const shade = presence.toFixed(3);
          const shine = (0.10 + presence * 0.26).toFixed(3);
          const shift = (-offset * 16).toFixed(2);

          card.style.setProperty("--post-depth", `${depth}px`);
          card.style.setProperty("--post-rotate-x", `${rotateX}deg`);
          card.style.setProperty("--post-rotate-y", `${rotateY}deg`);
          card.style.setProperty("--post-scale", scale);
          card.style.setProperty("--post-opacity", opacity);
          card.style.setProperty("--post-lift", `${lift}px`);
          card.style.setProperty("--post-shade", shade);
          card.style.setProperty("--post-shine", shine);
          card.style.setProperty("--post-shift", `${shift}px`);
          card.style.setProperty("--post-order", String(index));
          card.classList.toggle("is-scroll-focus", distance < 0.24);
        });
      }

      function getPostRailStep() {
        const card = postsList.querySelector(".login-post-list-card");
        if (!card) return Math.max(260, postsList.clientWidth * 0.72);
        const rect = card.getBoundingClientRect();
        return rect.width + 28;
      }

      function shiftPostsRail(direction) {
        const amount = getPostRailStep() * Number(direction || 1);
        postsList.scrollBy({ left: amount, behavior: "smooth" });
        schedulePostsScrollScene();
      }

      function renderPosts(posts) {
        const sortedPosts = posts
          .filter(Boolean)
          .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
          .slice(0, 6);
        postsCache = sortedPosts;

        if (!postsCache.length) {
          renderEmptyPosts(t("login.posts.empty", {}, "No posts have been published currently."));
          return;
        }

        postsStatus.classList.add("is-hidden");
        const cards = postsCache.map((post, index) => {
          const title = escapeHtml(post.title || t("login.posts.untitled", {}, "Untitled post"));
          const excerpt = escapeHtml(stripMarkdown(post.content).slice(0, 145));
          const image = resolveMediaUrl(post.image);
          const date = formatDate(post.created_at);

          return `
            <article class="student-post-list-card login-post-list-card" role="listitem" tabindex="0" data-post-index="${index}" style="--post-order:${index}">
              ${image
                ? `<img src="${escapeAttr(image)}" class="student-post-thumb" alt="${title}">`
                : `<div class="student-post-thumb student-post-thumb-placeholder" aria-hidden="true">${t("login.common.file", {}, "File")}</div>`}
              <div class="student-post-summary">
                <div>
                  <div class="student-post-label">${t("login.common.fromManagement", {}, "From administration")}</div>
                  <h3 class="student-post-list-title">${title}</h3>
                  <p>${excerpt || t("login.posts.openHint", {}, "Open the post to view the full details.")}</p>
                </div>
                <div class="student-post-list-actions">
                  <time class="student-post-date">${escapeHtml(date)}</time>
                  <button type="button" class="student-post-open" data-post-index="${index}">${t("login.common.openDetails", {}, "View details")}</button>
                </div>
              </div>
            </article>
          `;
        }).join("");

        postsList.innerHTML = `
          <div class="posts-dashboard student-posts-dashboard login-posts-dashboard">
            <div class="student-posts-list login-parent-posts-list" role="list">${cards}</div>
          </div>
        `;
        postsStage?.classList.add("has-posts");
        postsList.scrollLeft = 0;
        postsList.querySelectorAll("img").forEach(img => {
          if (!img.complete) img.addEventListener("load", schedulePostsScrollScene, { once: true });
        });
        schedulePostsScrollScene();
      }

      async function loadPosts() {
        refreshBtn.disabled = true;
        refreshBtn.classList.add("is-loading");
        renderEmptyPosts(t("login.posts.loading", {}, "Loading posts..."));

        try {
          const response = await Api.get("/posts");
          renderPosts(getPostsArray(response));
        } catch (err) {
          renderEmptyPosts(t("login.posts.loadFailed", {}, "Could not load posts currently."));
        } finally {
          refreshBtn.disabled = false;
          refreshBtn.classList.remove("is-loading");
        }
      }

      function openPost(index) {
        const post = postsCache[index];
        if (!post) return;

        const image = resolveMediaUrl(post.image);
        const title = escapeHtml(post.title || t("login.posts.untitled", {}, "Untitled post"));
        const date = escapeHtml(formatDate(post.created_at));
        const contentHtml = processPostMarkdown(post.content || "");

        postModalContent.innerHTML = `
          <div class="student-post-detail-topbar">
            <time class="student-post-date">${date}</time>
          </div>
          <article class="student-post-card student-post-detail login-post-detail">
            ${image ? `<img src="${escapeAttr(image)}" class="student-post-cover" alt="${title}">` : ""}
            <div class="student-post-head">
              <div>
                <div class="student-post-label">${t("login.common.fromManagement", {}, "From administration")}</div>
                <h3 class="preview-title" id="login-post-modal-title">${title}</h3>
              </div>
            </div>
            <div class="md-body">${contentHtml || `<p class="preview-placeholder">${t("login.common.noContent", {}, "This post has no content.")}</p>`}</div>
          </article>
        `;
        postModal.hidden = false;
        document.body.classList.add("modal-open");
        typesetMath(postModalContent);
        postModalClose.focus();
      }

      function closePostModal() {
        postModal.hidden = true;
        postModalContent.innerHTML = "";
        document.body.classList.remove("modal-open");
      }

      function rerenderLocalizedState() {
        I18n.apply(document);
        renderLanguageSelect();
        setLoginTheme(document.documentElement.dataset.theme || "light");
        renderPosts(postsCache);
      }

      renderLanguageSelect();
      setLoginTheme(document.documentElement.dataset.theme || "light");

      languageSelect?.addEventListener("change", async (event) => {
        languageSelect.disabled = true;
        await I18n.setLanguage(event.target.value);
        languageSelect.disabled = false;
      });

      window.addEventListener("i18n:change", (event) => {
        if (event.detail?.scope && event.detail.scope !== "login") return;
        rerenderLocalizedState();
      });

      themeToggle?.addEventListener("click", () => {
        setLoginTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorMsg.textContent = "";
        loginBtn.disabled = true;
        if (loginBtnLabel) loginBtnLabel.textContent = t("login.form.submitting", {}, "Signing in...");
        loginBtn.classList.add("loading");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        loginExperience?.pulse(loginBtn, "POST /users/login");

        try {
          const user = await Auth.login(username, password);
          loginExperience?.pulse(loginBtn, "session.accepted()");
          Router.redirectToDashboard(user.role_name);
        } catch (err) {
          errorMsg.textContent = err.message || t("login.form.error", {}, "Login failed. Please try again.");
          loginExperience?.pulse(errorMsg, "auth.rejected()");
          loginBtn.disabled = false;
          if (loginBtnLabel) loginBtnLabel.textContent = t("login.form.submit", {}, "Login");
          loginBtn.classList.remove("loading");
        }
      });

      refreshBtn.addEventListener("click", loadPosts);
      postsStage?.addEventListener("click", event => {
        const shiftButton = event.target.closest("[data-posts-shift]");
        if (!shiftButton) return;
        shiftPostsRail(Number(shiftButton.dataset.postsShift || 1));
      });
      postsList.addEventListener("wheel", event => {
        const canScroll = postsList.scrollWidth > postsList.clientWidth + 6;
        if (!canScroll || Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        postsList.scrollLeft += event.deltaY;
        event.preventDefault();
        schedulePostsScrollScene();
      }, { passive: false });
      postsList.addEventListener("pointerdown", event => {
        if (event.button !== 0 || event.target.closest("button, a, input, select, textarea")) return;
        postsDragState = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startScrollLeft: postsList.scrollLeft,
          moved: false
        };
        postsList.classList.add("is-dragging");
        try {
          postsList.setPointerCapture?.(event.pointerId);
        } catch (e) {}
      });
      postsList.addEventListener("pointermove", event => {
        if (!postsDragState || postsDragState.pointerId !== event.pointerId) return;
        const delta = event.clientX - postsDragState.startX;
        if (Math.abs(delta) > 4) postsDragState.moved = true;
        postsList.scrollLeft = postsDragState.startScrollLeft - delta;
        if (postsDragState.moved) event.preventDefault();
        schedulePostsScrollScene();
      });
      function endPostsDrag(event) {
        if (!postsDragState || postsDragState.pointerId !== event.pointerId) return;
        if (postsDragState.moved) suppressPostOpenUntil = Date.now() + 260;
        postsDragState = null;
        postsList.classList.remove("is-dragging");
        try {
          postsList.releasePointerCapture?.(event.pointerId);
        } catch (e) {}
      }
      postsList.addEventListener("pointerup", endPostsDrag);
      postsList.addEventListener("pointercancel", endPostsDrag);
      postsList.addEventListener("scroll", schedulePostsScrollScene, { passive: true });
      window.addEventListener("scroll", schedulePostsScrollScene, { passive: true });
      window.addEventListener("resize", schedulePostsScrollScene, { passive: true });
      postsList.addEventListener("click", event => {
        if (Date.now() < suppressPostOpenUntil) return;
        const target = event.target.closest("[data-post-index]");
        if (target) openPost(Number(target.dataset.postIndex));
      });
      postsList.addEventListener("keydown", event => {
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          shiftPostsRail(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-post-index]");
        if (!card) return;
        event.preventDefault();
        openPost(Number(card.dataset.postIndex));
      });
      postModal.addEventListener("click", event => {
        if (event.target === postModal) closePostModal();
      });
      postModalClose.addEventListener("click", closePostModal);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !postModal.hidden) closePostModal();
      });

      loadPosts();
    })();
  </script>
</body>
</html>
