  <script>
    (function () {
      const canvas = document.getElementById("login-3d-canvas");
      if (!canvas) return;

      const ctx = canvas.getContext("2d", { alpha: true });
      if (!ctx) return;

      const root = document.documentElement;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        targetX: 0,
        targetY: 0,
        lookX: 0,
        lookY: 0,
        pointerX: 0,
        pointerY: 0,
        pulse: 0,
        typingEnergy: 0,
        typingSpeed: 0,
        warp: 0,
        chaosEnergy: 0,
        chaosTarget: 0,
        chaosAttempts: 0,
        chaosX: 0,
        chaosY: 0
      };
      let points = [];
      let bursts = [];
      let chaosWaves = [];
      let frameId = 0;

      function isCosmicMode() {
        return root.dataset.loginCosmic === "true";
      }

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function getPalette() {
        const cosmic = isCosmicMode();
        if (cosmic) {
          return {
            cosmic: true,
            line: "103, 232, 249",
            point: "226, 244, 255",
            accent: "167, 139, 250",
            warm: "251, 191, 36",
            nebulaA: "67, 56, 202",
            nebulaB: "8, 145, 178"
          };
        }

        const dark = root.dataset.theme === "dark";
        return dark
          ? {
              line: "45, 212, 191",
              point: "226, 232, 240",
              accent: "96, 165, 250",
              warm: "251, 191, 36"
            }
          : {
              line: "15, 118, 110",
              point: "15, 23, 42",
              accent: "37, 99, 235",
              warm: "217, 119, 6"
            };
      }

      function buildScene() {
        const cosmic = isCosmicMode();
        const count = cosmic
          ? Math.min(260, Math.max(130, Math.floor((state.width * state.height) / 6600)))
          : Math.min(108, Math.max(58, Math.floor((state.width * state.height) / 14000)));

        if (cosmic) {
          const span = Math.min(state.width, state.height);
          points = Array.from({ length: count }, (_, index) => {
            const arm = index % 4;
            const radius = Math.pow(Math.random(), 0.62) * span * 0.72 + random(8, 34);
            const angle = radius * 0.014 + arm * Math.PI * 0.5 + random(-0.42, 0.42);
            const core = index < count * 0.18;
            return {
              x: core ? random(-span * 0.14, span * 0.14) : Math.cos(angle) * radius + random(-34, 34),
              y: core ? random(-span * 0.08, span * 0.08) : Math.sin(angle) * radius * 0.38 + random(-46, 46),
              z: random(-480, 780),
              size: core ? random(1.2, 3.2) : random(0.55, 2.4),
              speed: random(0.18, 0.62),
              phase: random(0, Math.PI * 2),
              arm
            };
          });
          return;
        }

        points = Array.from({ length: count }, () => ({
          x: random(-state.width * 0.7, state.width * 0.7),
          y: random(-state.height * 0.46, state.height * 0.46),
          z: random(-260, 620),
          size: random(0.9, 2.4),
          speed: random(0.16, 0.44),
          phase: random(0, Math.PI * 2)
        }));
      }

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = Math.max(1, window.innerWidth);
        state.height = Math.max(1, window.innerHeight);
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        state.pointerX = state.width / 2;
        state.pointerY = state.height / 2;
        buildScene();
        if (reducedMotion.matches) draw(performance.now());
      }

      function setPointer(clientX, clientY) {
        state.pointerX = clientX;
        state.pointerY = clientY;
        state.targetX = (clientX / state.width - 0.5) * 2;
        state.targetY = (clientY / state.height - 0.5) * 2;
        root.style.setProperty("--login-pointer-x", `${clientX}px`);
        root.style.setProperty("--login-pointer-y", `${clientY}px`);
        root.style.setProperty("--login-space-shift-x", `${(state.targetX * -18).toFixed(2)}px`);
        root.style.setProperty("--login-space-shift-y", `${(state.targetY * -14).toFixed(2)}px`);
        if (reducedMotion.matches) draw(performance.now());
      }

      function project(point, time) {
        const cosmic = isCosmicMode();
        const energy = cosmic ? state.typingEnergy : 0;
        const rotY = state.lookX * 0.34 + Math.sin(time * 0.12) * 0.04 + energy * 0.08;
        const rotX = state.lookY * -0.2 + Math.cos(time * 0.1) * 0.025 - energy * 0.035;
        const wobble = Math.sin(time * point.speed + point.phase);
        const wobbleAmp = cosmic ? 20 + energy * 48 : 20;
        let x = point.x + wobble * wobbleAmp;
        let y = point.y + Math.cos(time * point.speed + point.phase) * (cosmic ? 12 + energy * 28 : 12);
        let z = point.z + Math.sin(time * 0.34 + point.phase) * (cosmic ? 34 + state.warp * 120 : 34);

        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x1 = x * cosY - z * sinY;
        const z1 = x * sinY + z * cosY;

        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y1 = y * cosX - z1 * sinX;
        const z2 = y * sinX + z1 * cosX;

        const fov = Math.max(560, state.width * 0.72);
        const scale = fov / (fov + z2);
        return {
          x: state.width / 2 + x1 * scale + state.lookX * 26,
          y: state.height / 2 + y1 * scale + state.lookY * 18,
          z: z2,
          scale,
          size: point.size
        };
      }

      function drawOrbit(palette) {
        const centerX = state.width / 2 + state.lookX * 78;
        const centerY = state.height / 2 + state.lookY * 46;
        const base = Math.min(state.width, state.height);

        for (let index = 0; index < (palette.cosmic ? 7 : 4); index += 1) {
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(state.lookX * 0.28 + index * 0.38 + (palette.cosmic ? performance.now() * 0.000025 : 0));
          ctx.scale(1, palette.cosmic ? 0.22 + index * 0.026 : 0.34 + index * 0.035);
          ctx.beginPath();
          ctx.ellipse(0, 0, base * (0.28 + index * 0.074), base * (0.28 + index * 0.074), 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${index % 2 ? palette.accent : palette.line}, ${palette.cosmic ? 0.12 - index * 0.01 : 0.08 - index * 0.01})`;
          ctx.lineWidth = palette.cosmic ? 1.35 : 1.2;
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawCosmicBackdrop(palette, time) {
        const centerX = state.width / 2 + state.lookX * 66;
        const centerY = state.height / 2 + state.lookY * 38;
        const radius = Math.max(state.width, state.height) * 0.72;
        const nebula = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
        nebula.addColorStop(0, `rgba(${palette.nebulaB}, ${0.22 + state.typingEnergy * 0.22})`);
        nebula.addColorStop(0.38, `rgba(${palette.nebulaA}, ${0.12 + state.typingEnergy * 0.16})`);
        nebula.addColorStop(1, "rgba(3, 7, 18, 0)");
        ctx.fillStyle = nebula;
        ctx.fillRect(0, 0, state.width, state.height);

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(time * (0.026 + state.typingSpeed * 0.006) + state.lookX * 0.16);
        for (let index = 0; index < 5; index += 1) {
          ctx.beginPath();
          ctx.arc(0, 0, Math.min(state.width, state.height) * (0.14 + index * 0.08), index * 0.74, Math.PI * 1.45 + index * 0.74);
          ctx.strokeStyle = `rgba(${index % 2 ? palette.accent : palette.line}, ${0.08 - index * 0.01 + state.typingEnergy * 0.035})`;
          ctx.lineWidth = 10 - index + state.typingEnergy * 6;
          ctx.stroke();
        }
        ctx.restore();
      }

      function emitCosmicSignal(detail = {}) {
        if (!isCosmicMode()) return;

        const x = clamp(Number(detail.x) || state.width / 2, 0, state.width);
        const y = clamp(Number(detail.y) || state.height / 2, 0, state.height);
        const speed = clamp(Number(detail.speed) || 1, 0.4, 8);
        const raw = String(detail.char || "");
        const char = detail.secure ? "•" : (raw && raw !== " " ? raw.slice(-1) : "∴");
        const kind = detail.kind || (
          /\d/.test(raw) ? "digit" :
          /[^\w\s\u0600-\u06FF]/.test(raw) ? "symbol" :
          raw === " " ? "space" :
          "letter"
        );
        const count = Math.min(7, Math.max(2, Math.round(speed)));

        state.typingEnergy = clamp(state.typingEnergy + 0.18 + speed * 0.055, 0, 1.6);
        state.typingSpeed = clamp(speed, 0, 8);
        state.warp = clamp(state.warp + 0.08 + speed * 0.018, 0, 1);
        state.pulse = Math.max(state.pulse, 0.55);

        for (let index = 0; index < count; index += 1) {
          bursts.push({
            x: x + random(-18, 18),
            y: y + random(-14, 14),
            char,
            kind,
            born: performance.now(),
            ttl: random(720, 1280) / (speed > 4 ? 0.86 : 1),
            angle: random(0, Math.PI * 2),
            spin: random(-1.4, 1.4),
            radius: random(18, 54) + speed * 8,
            speed
          });
        }

        if (bursts.length > 90) bursts = bursts.slice(-90);
      }

      function emitCosmicChaos(detail = {}) {
        if (!isCosmicMode()) return;

        const x = clamp(Number(detail.x) || state.width / 2, 0, state.width);
        const y = clamp(Number(detail.y) || state.height / 2, 0, state.height);
        const force = clamp(Number(detail.force) || 1, 0.7, 3.5);
        const now = performance.now();
        const base = Math.max(state.width, state.height);

        state.chaosAttempts += 1;
        state.chaosX = x;
        state.chaosY = y;
        state.chaosTarget = clamp(
          state.chaosTarget + 0.16 + force * 0.14 + Math.min(state.chaosAttempts, 12) * 0.012,
          0,
          2.4
        );
        state.typingEnergy = clamp(state.typingEnergy + 0.12 + force * 0.04, 0, 1.8);
        state.warp = clamp(state.warp + 0.06 + force * 0.035, 0, 1.25);
        state.pulse = Math.max(state.pulse, 0.72);

        for (let index = 0; index < 3; index += 1) {
          chaosWaves.push({
            x: x + random(-base * 0.04, base * 0.04),
            y: y + random(-base * 0.035, base * 0.035),
            born: now + index * 140,
            ttl: random(3600, 5600) + force * 680,
            radius: random(base * 0.08, base * 0.2),
            expand: random(base * 0.22, base * 0.44) + force * 38,
            spin: random(-0.9, 0.9),
            phase: random(0, Math.PI * 2),
            sides: Math.floor(random(5, 9)),
            tone: index % 3
          });
        }

        if (chaosWaves.length > 42) chaosWaves = chaosWaves.slice(-42);
      }

      function drawStrangeObjects(palette, time) {
        const energy = state.typingEnergy;
        const centerX = state.width * 0.56 + state.lookX * 84;
        const centerY = state.height * 0.48 + state.lookY * 52;
        const size = Math.min(state.width, state.height);

        for (let index = 0; index < 3; index += 1) {
          const angle = time * (0.16 + index * 0.045) + index * Math.PI * 0.66;
          const x = centerX + Math.cos(angle) * size * (0.18 + index * 0.07);
          const y = centerY + Math.sin(angle * 1.28) * size * (0.09 + index * 0.045);
          const radius = 24 + index * 13 + energy * 20;

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(-angle * 0.7);
          const voidGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 1.8);
          voidGradient.addColorStop(0, "rgba(2, 6, 23, 0.86)");
          voidGradient.addColorStop(0.48, `rgba(${palette.accent}, ${0.08 + energy * 0.06})`);
          voidGradient.addColorStop(1, "rgba(2, 6, 23, 0)");
          ctx.fillStyle = voidGradient;
          ctx.beginPath();
          ctx.ellipse(0, 0, radius * 1.45, radius * 0.54, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = `rgba(${index % 2 ? palette.line : palette.accent}, ${0.16 + energy * 0.12})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.ellipse(0, 0, radius * 1.62, radius * 0.62, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawCosmicChaos(palette, now, time) {
        state.chaosEnergy += (state.chaosTarget - state.chaosEnergy) * 0.038;
        state.chaosTarget *= 0.994;
        if (state.chaosTarget < 0.004) state.chaosTarget = 0;
        if (state.chaosEnergy < 0.004 && state.chaosTarget === 0) state.chaosEnergy = 0;

        if (state.chaosEnergy <= 0.01 && !chaosWaves.length) return;

        const energy = clamp(state.chaosEnergy, 0, 2.4);
        const centerX = state.chaosX || state.width / 2;
        const centerY = state.chaosY || state.height / 2;
        const base = Math.max(state.width, state.height);
        const glowRadius = base * (0.28 + energy * 0.2);

        ctx.save();
        ctx.globalCompositeOperation = "screen";

        const halo = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowRadius);
        halo.addColorStop(0, `rgba(${palette.warm}, ${0.04 + energy * 0.035})`);
        halo.addColorStop(0.28, `rgba(${palette.accent}, ${0.05 + energy * 0.045})`);
        halo.addColorStop(0.64, `rgba(${palette.line}, ${0.025 + energy * 0.028})`);
        halo.addColorStop(1, "rgba(2, 6, 23, 0)");
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, state.width, state.height);

        ctx.translate(centerX, centerY);
        for (let index = 0; index < 8; index += 1) {
          const radius = base * (0.1 + index * 0.043 + energy * 0.018);
          const wobble = Math.sin(time * 0.42 + index * 1.7) * 0.08;
          ctx.save();
          ctx.rotate(time * (0.045 + index * 0.006) + index * 0.72 + energy * 0.05);
          ctx.scale(1, 0.24 + index * 0.018 + wobble);
          ctx.beginPath();
          ctx.ellipse(0, 0, radius, radius, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${index % 2 ? palette.accent : palette.line}, ${0.025 + energy * 0.032 - index * 0.0018})`;
          ctx.lineWidth = 1.1 + energy * 1.4;

        state.typingSpeed *= 0.9;
        state.warp *= 0.9;

        if (!reducedMotion.matches && !document.hidden) {
          frameId = window.requestAnimationFrame(draw);
        }
      }

      function start() {

      window.addEventListener("pointermove", event => setPointer(event.clientX, event.clientY), { passive: true });

        type: emitCosmicSignal,

        reset() {

          chaosWaves = [];

          state.typingSpeed = 0;
          state.warp = 0;
          state.chaosEnergy = 0;
          state.chaosTarget = 0;
          state.chaosAttempts = 0;

      function dodgeLoginButton(pointerX, pointerY, force = 1) {
        if (!loginBtn || !isCosmicActive() || hasLoginCredentials()) {

        const computed = getComputedStyle(document.documentElement);
        const currentX = parseFloat(computed.getPropertyValue("--login-button-dodge-x")) || 0;
        const currentY = parseFloat(computed.getPropertyValue("--login-button-dodge-y")) || 0;
        const currentRotate = computed.getPropertyValue("--login-button-dodge-rotate").trim() || "0deg";
        const rect = loginBtn.getBoundingClientRect();
        const card = loginBtn.closest(".login-card")?.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2 - currentX;
        const centerY = rect.top + rect.height / 2 - currentY;
        const dx = centerX - pointerX;
        const dy = centerY - pointerY;
        const distance = Math.max(1, Math.hypot(dx, dy));

        if (now - lastDodgeAt < 520) return;

        const viewportPadding = 14;
        const minX = viewportPadding - (centerX - rect.width / 2);
        const maxX = window.innerWidth - viewportPadding - (centerX + rect.width / 2);
        const minY = viewportPadding - (centerY - rect.height / 2);
        const maxY = window.innerHeight - viewportPadding - (centerY + rect.height / 2);
        const side = dodgeAttemptCount % 2 === 0 ? 1 : -1;
        const insetX = Math.min(36, Math.max(12, window.innerWidth * 0.018));
        const insetY = Math.min(34, Math.max(12, window.innerHeight * 0.018));
        const leftX = Math.min(maxX, minX + insetX);
        const rightX = Math.max(minX, maxX - insetX);
        const topY = Math.min(maxY, minY + insetY);
        const bottomY = Math.max(minY, maxY - insetY);
        const midLeftX = Math.min(maxX, minX + Math.max(insetX, (maxX - minX) * 0.18));
        const midRightX = Math.max(minX, maxX - Math.max(insetX, (maxX - minX) * 0.18));
        const midTopY = Math.min(maxY, minY + Math.max(insetY, (maxY - minY) * 0.22));
        const midBottomY = Math.max(minY, maxY - Math.max(insetY, (maxY - minY) * 0.22));
        const candidates = [
          { x: leftX, y: topY },
          { x: rightX, y: topY },
          { x: leftX, y: bottomY },
          { x: rightX, y: bottomY },
          { x: midLeftX, y: midBottomY },
          { x: midRightX, y: midTopY },

        let bestScore = -Infinity;
        candidates.forEach((candidate, index) => {
          const candidateCenterX = centerX + candidate.x;
          const candidateCenterY = centerY + candidate.y;
          const pointerDistance = Math.hypot(candidateCenterX - pointerX, candidateCenterY - pointerY);
          const currentDistance = Math.hypot(candidate.x - currentX, candidate.y - currentY);
          const originalDistance = Math.hypot(candidate.x, candidate.y);

        const rotate = Math.max(-9, Math.min(9, nextX * 0.018 + arcSide * 2.6));

        if (themeLabel) {
          themeLabel.textContent = nextTheme === "dark"
            ? t("login.theme.dark", {}, "Dark mode")
            : t("login.theme.light", {}, "Light mode");
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function stripMarkdown(value) {
        return String(value || "")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/!\[[^\]]*\]\([^)]+\)/g, " ")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/[#>*_`~|$\\-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function getFileIcon(ext) {
        return ext ? String(ext).toUpperCase().slice(0, 4) : t("login.common.file", {}, "File");
      }

      function processPostMarkdown(raw) {
        if (!raw) return "";

        const downloadWords = ["\\u062a\\u062d\\u0645\\u064a\\u0644", "Download", "Telecharger", "Telechargement"];
        const downloadPattern = new RegExp(`\\[(?:${downloadWords.join("|")}):\\s*([^\\]|]+?)(?:\\|([^\\]|]*?))?(?:\\|([^\\]]*?))?\\]\\(([^)]+)\\)`, "g");
        let source = String(raw).replace(downloadPattern, (_, name, type, size, url) => {
          const safeUrl = escapeAttr(url.trim());
          const safeName = escapeHtml(name.trim());
          const ext = safeUrl.split(".").pop()?.split("?")[0];
          const icon = getFileIcon(ext);
          const meta = [type, size].map(part => part?.trim()).filter(Boolean).join(" - ");

          return `
            <a href="${safeUrl}" target="_blank" class="dl-card" rel="noopener noreferrer">
              <span class="dl-card-icon">${icon}</span>
              <span class="dl-card-info">
                <span class="dl-card-name">${safeName}</span>
                ${meta ? `<span class="dl-card-meta">${escapeHtml(meta)}</span>` : ""}
              </span>
              <span class="dl-card-btn">${t("login.common.download", {}, "Download")}</span>
            </a>
          `;
        });

        let html = typeof marked !== "undefined"
          ? marked.parse(source, { gfm: true, breaks: true, tables: true })
          : escapeHtml(source).replace(/\n/g, "<br>");

        if (typeof DOMPurify !== "undefined") {
          html = DOMPurify.sanitize(html, {
            ADD_ATTR: ["target", "rel", "class"]
          });
        }

        return html;
      }

      function typesetMath(container, attempt = 0) {
        if (!container || typeof MathJax === "undefined") return;

        if (MathJax.typesetPromise) {
          if (MathJax.typesetClear) MathJax.typesetClear([container]);
          MathJax.typesetPromise([container]).catch(() => {});
          return;
        }

        if (MathJax.startup?.promise) {
          MathJax.startup.promise.then(() => typesetMath(container, attempt + 1)).catch(() => {});
          return;
        }

        if (attempt < 8) {
          setTimeout(() => typesetMath(container, attempt + 1), 250);
        }
      }

      function resolveMediaUrl(url) {
        const value = String(url || "").trim();
        if (!value) return "";
        if (/^(https?:|data:|blob:)/i.test(value)) return value;
        if (value.startsWith("/")) return `${API_BASE_URL}${value}`;
        return value;
      }

      function formatDate(value) {
        if (!value) return t("login.common.unknownDate", {}, "Unknown date");
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return t("login.common.unknownDate", {}, "Unknown date");
        return date.toLocaleDateString(locale(), { year: "numeric", month: "long", day: "numeric" });
      }

      function getPostsArray(response) {
        if (Array.isArray(response)) return response;
        if (Array.isArray(response?.data)) return response.data;
        return [];
      }

      function renderEmptyPosts(message) {
        postsList.innerHTML = "";
        postsStatus.textContent = message;
        postsStatus.classList.remove("is-hidden");
      }

      function renderPosts(posts) {
        const sortedPosts = posts
          .filter(Boolean)
          .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
          .slice(0, 6);
        postsCache = sortedPosts;

        if (!postsCache.length) {
          renderEmptyPosts(t("login.posts.empty", {}, "No posts have been published currently."));
          return;
        }

        postsStatus.classList.add("is-hidden");
        const cards = postsCache.map((post, index) => {
          const title = escapeHtml(post.title || t("login.posts.untitled", {}, "Untitled post"));
          const excerpt = escapeHtml(stripMarkdown(post.content).slice(0, 145));
          const image = resolveMediaUrl(post.image);
          const date = formatDate(post.created_at);

          return `
            <article class="student-post-list-card login-post-list-card" tabindex="0" data-post-index="${index}">
              ${image
                ? `<img src="${escapeAttr(image)}" class="student-post-thumb" alt="${title}">`
                : `<div class="student-post-thumb student-post-thumb-placeholder" aria-hidden="true">${t("login.common.file", {}, "File")}</div>`}
              <div class="student-post-summary">
                <div>
                  <div class="student-post-label">${t("login.common.fromManagement", {}, "From administration")}</div>
                  <h3 class="student-post-list-title">${title}</h3>
                  <p>${excerpt || t("login.posts.openHint", {}, "Open the post to view the full details.")}</p>
                </div>
                <div class="student-post-list-actions">
                  <time class="student-post-date">${escapeHtml(date)}</time>
                  <button type="button" class="student-post-open" data-post-index="${index}">${t("login.common.openDetails", {}, "View details")}</button>
                </div>
              </div>
            </article>
          `;
        }).join("");

        postsList.innerHTML = `
          <div class="posts-dashboard student-posts-dashboard login-posts-dashboard">
            <div class="student-posts-list login-parent-posts-list">${cards}</div>
          </div>
        `;
      }

      async function loadPosts() {
        refreshBtn.disabled = true;
        refreshBtn.classList.add("is-loading");
        renderEmptyPosts(t("login.posts.loading", {}, "Loading posts..."));

        try {
          const response = await Api.get("/posts");
          renderPosts(getPostsArray(response));
        } catch (err) {
          renderEmptyPosts(t("login.posts.loadFailed", {}, "Could not load posts currently."));
        } finally {
          refreshBtn.disabled = false;
          refreshBtn.classList.remove("is-loading");
        }
      }

      function openPost(index) {
        const post = postsCache[index];
        if (!post) return;

        const image = resolveMediaUrl(post.image);
        const title = escapeHtml(post.title || t("login.posts.untitled", {}, "Untitled post"));
        const date = escapeHtml(formatDate(post.created_at));
        const contentHtml = processPostMarkdown(post.content || "");

        postModalContent.innerHTML = `
          <div class="student-post-detail-topbar">
            <time class="student-post-date">${date}</time>
          </div>
          <article class="student-post-card student-post-detail login-post-detail">
            ${image ? `<img src="${escapeAttr(image)}" class="student-post-cover" alt="${title}">` : ""}
            <div class="student-post-head">
              <div>
                <div class="student-post-label">${t("login.common.fromManagement", {}, "From administration")}</div>
                <h3 class="preview-title" id="login-post-modal-title">${title}</h3>
              </div>
            </div>
            <div class="md-body">${contentHtml || `<p class="preview-placeholder">${t("login.common.noContent", {}, "This post has no content.")}</p>`}</div>
          </article>
        `;
        postModal.hidden = false;
        document.body.classList.add("modal-open");
        typesetMath(postModalContent);
        postModalClose.focus();
      }

      function closePostModal() {
        postModal.hidden = true;
        postModalContent.innerHTML = "";
        document.body.classList.remove("modal-open");
      }

      function rerenderLocalizedState() {
        I18n.apply(document);
        renderLanguageSelect();
        setLoginTheme(document.documentElement.dataset.theme || "light");
        setLoginCosmicMode(document.documentElement.dataset.loginCosmic === "true", { persist: false });
        renderPosts(postsCache);
      }

      renderLanguageSelect();
      setLoginTheme(document.documentElement.dataset.theme || "light");
      setLoginCosmicMode(getStoredCosmicMode(), { persist: false });

      languageSelect?.addEventListener("change", async (event) => {
        languageSelect.disabled = true;
        await I18n.setLanguage(event.target.value);
        languageSelect.disabled = false;
      });

      window.addEventListener("i18n:change", (event) => {
        if (event.detail?.scope && event.detail.scope !== "login") return;
        rerenderLocalizedState();
      });

      themeToggle?.addEventListener("click", () => {
        setLoginTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      });

      cosmicToggle?.addEventListener("click", () => {
        setLoginCosmicMode(document.documentElement.dataset.loginCosmic !== "true");
      });

      [usernameInput, passwordInput].forEach(input => {
        input?.addEventListener("input", emitTypingCosmicEffect);
        input?.addEventListener("focus", event => {
          pulseCosmicFromElement(event.currentTarget, {
            char: event.currentTarget.type === "password" ? "∗" : "∴",
            kind: "symbol",
            speed: 2.4,
            secure: event.currentTarget.type === "password"
          });
        });
      });

      loginBtn?.addEventListener("pointermove", event => {
        dodgeLoginButton(event.clientX, event.clientY, 1.22);
      }, { passive: true });

      loginBtn?.addEventListener("pointerenter", event => {
        dodgeLoginButton(event.clientX, event.clientY, 1.42);
      }, { passive: true });

      loginBtn?.addEventListener("click", event => {
        if (!isCosmicActive() || hasLoginCredentials()) return;
        event.preventDefault();
        dodgeLoginButton(event.clientX, event.clientY, 1.35);
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorMsg.textContent = "";

        if (isCosmicActive() && !hasLoginCredentials()) {
          const missingInput = usernameInput?.value.trim() ? passwordInput : usernameInput;
          const fallback = isArabicInterface()
            ? "أكمل اسم المستخدم وكلمة المرور أولًا."
            : "Enter your username and password first.";
          errorMsg.textContent = t("login.form.missingCredentials", {}, fallback);
          missingInput?.focus();
          dodgeLoginButton(window.innerWidth / 2, window.innerHeight / 2, 1.35);
          triggerLoginChaos(window.innerWidth / 2, window.innerHeight / 2, 1.9);
          markMissingInput(missingInput);
          pulseCosmicFromElement(errorMsg, { char: "!", kind: "symbol", speed: 6 });
          return;
        }

        loginBtn.disabled = true;
        if (loginBtnLabel) loginBtnLabel.textContent = t("login.form.submitting", {}, "Signing in...");
        loginBtn.classList.add("loading");

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        try {
          const user = await Auth.login(username, password);
          Router.redirectToDashboard(user.role_name);
        } catch (err) {
          errorMsg.textContent = err.message || t("login.form.error", {}, "Login failed. Please try again.");
          loginBtn.disabled = false;
          if (loginBtnLabel) loginBtnLabel.textContent = t("login.form.submit", {}, "Login");
          loginBtn.classList.remove("loading");
        }
      });

      refreshBtn.addEventListener("click", loadPosts);
      postsList.addEventListener("click", event => {
        const target = event.target.closest("[data-post-index]");
        if (target) openPost(Number(target.dataset.postIndex));
      });
      postsList.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-post-index]");
        if (!card) return;
        event.preventDefault();
        openPost(Number(card.dataset.postIndex));
      });
      postModal.addEventListener("click", event => {
        if (event.target === postModal) closePostModal();
      });
      postModalClose.addEventListener("click", closePostModal);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !postModal.hidden) closePostModal();
      });

      loadPosts();
    })();
  </script>
</body>
</html>
