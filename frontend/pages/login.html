<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | نظام إدارة المدرسة</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2" />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("login-theme");
        var theme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#0b1220" : "#0f766e");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/posts.css?v=login-posts-1">
  <link rel="stylesheet" href="../css/login.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-auth-panel" aria-labelledby="login-title">
      <div class="login-panel-toolbar">
        <button type="button" class="login-theme-toggle" id="login-theme-toggle" aria-pressed="false">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="M4.93 4.93 6.34 6.34"/>
            <path d="M17.66 17.66 19.07 19.07"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="M6.34 17.66 4.93 19.07"/>
            <path d="M19.07 4.93 17.66 6.34"/>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
          </svg>
          <span id="login-theme-label">الوضع الفاتح</span>
        </button>
      </div>

      <div class="login-brand">
        <div class="login-emblem" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 21 32 12l18 9-18 9-18-9Z"/>
            <path d="M22 29v10c5.6 4.1 14.4 4.1 20 0V29"/>
            <path d="M50 22v14"/>
            <path d="M20 49h24"/>
          </svg>
        </div>
        <div>
          <p class="login-kicker">School Management System</p>
          <h1 id="login-title">نظام إدارة المدرسة</h1>
        </div>
      </div>

      <div class="login-card">
        <div class="login-card-head">
          <h2>تسجيل الدخول</h2>
          <p>ادخل إلى مساحة العمل الخاصة بك حسب صلاحيات الحساب.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="username">اسم المستخدم</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="username"
                required
                autocomplete="username"
              />
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </span>
            </div>
          </div>

          <div class="field-group">
            <label for="password">كلمة المرور</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="11" width="14" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                  <path d="M12 16v2"/>
                </svg>
              </span>
            </div>
          </div>

          <button type="submit" id="login-btn">
            <span>دخول</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>
          </button>
        </form>

        <div id="error-msg" role="alert" aria-live="polite"></div>
      </div>

      <p class="login-footer">جميع الحقوق محفوظة &copy; 2026 — نظام إدارة المدرسة</p>
    </section>

    <section class="login-posts-panel" aria-labelledby="posts-title">
      <div class="posts-panel-head">
        <div>
          <p class="login-kicker">إعلانات المدرسة</p>
          <h2 id="posts-title">آخر المنشورات</h2>
        </div>
        <button type="button" class="posts-refresh-btn" id="posts-refresh-btn" title="تحديث المنشورات" aria-label="تحديث المنشورات">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 0 1-15.2 6.5L3 16"/>
            <path d="M3 16h5v5"/>
            <path d="M3 12A9 9 0 0 1 18.2 5.5L21 8"/>
            <path d="M21 8h-5V3"/>
          </svg>
        </button>
      </div>

      <div id="login-posts-status" class="posts-status">جاري تحميل المنشورات...</div>
      <div id="login-posts-list" class="login-posts-content" aria-live="polite"></div>
    </section>
  </main>

  <div id="login-post-modal" class="login-post-modal" hidden>
    <div class="login-post-modal-card" role="dialog" aria-modal="true" aria-labelledby="login-post-modal-title">
      <button type="button" class="modal-close-btn" id="login-post-modal-close" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
      <div id="login-post-modal-content"></div>
    </div>
  </div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/router.js"></script>
  <script>
    (function () {
      if (Auth.isAuthenticated()) {
        const session = Auth.getSession();
        Router.redirectToDashboard(session.role);
        return;
      }

      const form = document.getElementById("login-form");
      const errorMsg = document.getElementById("error-msg");
      const loginBtn = document.getElementById("login-btn");
      const postsList = document.getElementById("login-posts-list");
      const postsStatus = document.getElementById("login-posts-status");
      const refreshBtn = document.getElementById("posts-refresh-btn");
      const themeToggle = document.getElementById("login-theme-toggle");
      const themeLabel = document.getElementById("login-theme-label");
      const postModal = document.getElementById("login-post-modal");
      const postModalContent = document.getElementById("login-post-modal-content");
      const postModalClose = document.getElementById("login-post-modal-close");
      let postsCache = [];

      function setLoginTheme(theme) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        document.body.dataset.theme = nextTheme;
        localStorage.setItem("login-theme", nextTheme);
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", nextTheme === "dark" ? "#0b1220" : "#0f766e");
        themeToggle?.setAttribute("aria-pressed", String(nextTheme === "dark"));
        if (themeLabel) themeLabel.textContent = nextTheme === "dark" ? "الوضع المظلم" : "الوضع الفاتح";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function stripMarkdown(value) {
        return String(value || "")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/!\[[^\]]*\]\([^)]+\)/g, " ")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/[#>*_`~|$\\-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function getFileIcon(ext) {
        const icons = {
          pdf: "📄", doc: "📝", docx: "📝", xls: "📊", xlsx: "📊",
          ppt: "📑", pptx: "📑", zip: "🗜️", rar: "🗜️",
          mp4: "🎬", mp3: "🎵", png: "🖼️", jpg: "🖼️", jpeg: "🖼️"
        };
        return icons[String(ext || "").toLowerCase()] || "📎";
      }

      function processPostMarkdown(raw) {
        if (!raw) return "";

        let source = String(raw).replace(
          /\[تحميل:\s*([^\]|]+?)(?:\|([^\]|]*?))?(?:\|([^\]]*?))?\]\(([^)]+)\)/g,
          (_, name, type, size, url) => {
            const safeUrl = escapeHtml(url.trim());
            const safeName = escapeHtml(name.trim());
            const ext = safeUrl.split(".").pop()?.split("?")[0];
            const icon = getFileIcon(ext);
            const meta = [type, size].map(part => part?.trim()).filter(Boolean).join(" · ");

            return `
              <a href="${safeUrl}" target="_blank" class="dl-card" rel="noopener noreferrer">
                <span class="dl-card-icon">${icon}</span>
                <span class="dl-card-info">
                  <span class="dl-card-name">${safeName}</span>
                  ${meta ? `<span class="dl-card-meta">${escapeHtml(meta)}</span>` : ""}
                </span>
                <span class="dl-card-btn">تحميل</span>
              </a>
            `;
          }
        );

        let html = typeof marked !== "undefined"
          ? marked.parse(source, { gfm: true, breaks: true, tables: true })
          : escapeHtml(source).replace(/\n/g, "<br>");

        if (typeof DOMPurify !== "undefined") {
          html = DOMPurify.sanitize(html, {
            ADD_ATTR: ["target", "rel", "class"]
          });
        }

        return html;
      }

      function typesetMath(container, attempt = 0) {
        if (!container || typeof MathJax === "undefined") return;

        if (MathJax.typesetPromise) {
          if (MathJax.typesetClear) MathJax.typesetClear([container]);
          MathJax.typesetPromise([container]).catch(() => {});
          return;
        }

        if (MathJax.startup?.promise) {
          MathJax.startup.promise.then(() => typesetMath(container, attempt + 1)).catch(() => {});
          return;
        }

        if (attempt < 8) {
          setTimeout(() => typesetMath(container, attempt + 1), 250);
        }
      }

      function resolveMediaUrl(url) {
        const value = String(url || "").trim();
        if (!value) return "";
        if (/^(https?:|data:|blob:)/i.test(value)) return value;
        if (value.startsWith("/")) return `${API_BASE_URL}${value}`;
        return value;
      }

      function formatDate(value) {
        if (!value) return "تاريخ غير محدد";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "تاريخ غير محدد";
        return date.toLocaleDateString("ar-DZ", { year: "numeric", month: "long", day: "numeric" });
      }

      function getPostsArray(response) {
        if (Array.isArray(response)) return response;
        if (Array.isArray(response?.data)) return response.data;
        return [];
      }

      function renderEmptyPosts(message) {
        postsList.innerHTML = "";
        postsStatus.textContent = message;
        postsStatus.classList.remove("is-hidden");
      }

      function renderPosts(posts) {
        const sortedPosts = posts
          .filter(Boolean)
          .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
          .slice(0, 6);
        postsCache = sortedPosts;

        if (!postsCache.length) {
          renderEmptyPosts("لا توجد منشورات منشورة حالياً.");
          return;
        }

        postsStatus.classList.add("is-hidden");
        const cards = postsCache.map((post, index) => {
          const title = escapeHtml(post.title || "منشور بدون عنوان");
          const excerpt = escapeHtml(stripMarkdown(post.content).slice(0, 145));
          const image = resolveMediaUrl(post.image);
          const date = formatDate(post.created_at);

          return `
            <article class="student-post-list-card login-post-list-card" tabindex="0" data-post-index="${index}">
              ${image
                ? `<img src="${escapeHtml(image)}" class="student-post-thumb" alt="${title}">`
                : `<div class="student-post-thumb student-post-thumb-placeholder" aria-hidden="true">📄</div>`}
              <div class="student-post-summary">
                <div>
                  <div class="student-post-label">من الإدارة</div>
                  <h3 class="student-post-list-title">${title}</h3>
                  <p>${excerpt || "يمكن عرض تفاصيل هذا المنشور بالكامل."}</p>
                </div>
                <div class="student-post-list-actions">
                  <time class="student-post-date">${escapeHtml(date)}</time>
                  <button type="button" class="student-post-open" data-post-index="${index}">عرض التفاصيل</button>
                </div>
              </div>
            </article>
          `;
        }).join("");

        postsList.innerHTML = `
          <div class="posts-dashboard student-posts-dashboard login-posts-dashboard">
            <div class="student-posts-list login-parent-posts-list">${cards}</div>
          </div>
        `;
      }

      async function loadPosts() {
        refreshBtn.disabled = true;
        refreshBtn.classList.add("is-loading");
        renderEmptyPosts("جاري تحميل المنشورات...");

        try {
          const response = await Api.get("/posts");
          renderPosts(getPostsArray(response));
        } catch (err) {
          renderEmptyPosts("تعذر تحميل المنشورات حالياً.");
        } finally {
          refreshBtn.disabled = false;
          refreshBtn.classList.remove("is-loading");
        }
      }

      function openPost(index) {
        const post = postsCache[index];
        if (!post) return;

        const image = resolveMediaUrl(post.image);
        const title = escapeHtml(post.title || "منشور بدون عنوان");
        const date = escapeHtml(formatDate(post.created_at));
        const contentHtml = processPostMarkdown(post.content || "");

        postModalContent.innerHTML = `
          <div class="student-post-detail-topbar">
            <time class="student-post-date">${date}</time>
          </div>
          <article class="student-post-card student-post-detail login-post-detail">
            ${image ? `<img src="${escapeHtml(image)}" class="student-post-cover" alt="${title}">` : ""}
            <div class="student-post-head">
              <div>
                <div class="student-post-label">من الإدارة</div>
                <h3 class="preview-title" id="login-post-modal-title">${title}</h3>
              </div>
            </div>
            <div class="md-body">${contentHtml || '<p class="preview-placeholder">لا يوجد محتوى لهذا المنشور.</p>'}</div>
          </article>
        `;
        postModal.hidden = false;
        document.body.classList.add("modal-open");
        typesetMath(postModalContent);
        postModalClose.focus();
      }

      function closePostModal() {
        postModal.hidden = true;
        postModalContent.innerHTML = "";
        document.body.classList.remove("modal-open");
      }

      setLoginTheme(document.documentElement.dataset.theme || "light");
      themeToggle?.addEventListener("click", () => {
        setLoginTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorMsg.textContent = "";
        loginBtn.disabled = true;
        loginBtn.querySelector("span").textContent = "جاري الدخول...";
        loginBtn.classList.add("loading");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const user = await Auth.login(username, password);
          Router.redirectToDashboard(user.role_name);
        } catch (err) {
          errorMsg.textContent = err.message || "فشل تسجيل الدخول. حاول مرة أخرى.";
          loginBtn.disabled = false;
          loginBtn.querySelector("span").textContent = "دخول";
          loginBtn.classList.remove("loading");
        }
      });

      refreshBtn.addEventListener("click", loadPosts);
      postsList.addEventListener("click", event => {
        const target = event.target.closest("[data-post-index]");
        if (target) openPost(Number(target.dataset.postIndex));
      });
      postsList.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-post-index]");
        if (!card) return;
        event.preventDefault();
        openPost(Number(card.dataset.postIndex));
      });
      postModal.addEventListener("click", event => {
        if (event.target === postModal) closePostModal();
      });
      postModalClose.addEventListener("click", closePostModal);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !postModal.hidden) closePostModal();
      });

      loadPosts();
    })();
  </script>
</body>
</html>
