<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المدير | النظام المدرسي</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2">
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("admin-theme");
        var theme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/posts.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
</head>
<body class="admin-shell">

  <aside class="sidebar">
    <div class="sidebar-header" id="admin-header"></div>
    <div class="sidebar-utility">
      <button type="button" class="sidebar-collapse-btn" id="admin-sidebar-collapse" aria-label="تصغير الشريط الجانبي" aria-pressed="false" title="تصغير الشريط الجانبي">
        <span class="sidebar-collapse-icon"></span>
        <span class="sidebar-collapse-label">تصغير القائمة</span>
      </button>
      <div class="sidebar-search">
        <span aria-hidden="true"></span>
        <input type="search" id="admin-nav-search" placeholder="بحث سريع..." autocomplete="off">
      </div>
    </div>
    <nav class="sidebar-nav" id="admin-nav"></nav>
  </aside>
  <div class="sidebar-backdrop" id="admin-sidebar-backdrop"></div>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <button type="button" class="mobile-menu-btn" id="admin-menu-toggle" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      <h2 style="margin: 0;" id="section-title">نظرة عامة</h2>
      </div>
      <div class="topbar-actions">
        <button type="button" class="theme-toggle-btn" id="admin-theme-toggle" aria-label="تبديل الثيم" aria-pressed="false" title="تبديل الثيم">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
          <span class="theme-toggle-label">فاتح</span>
        </button>
        <span id="user-info" style="margin-left: 15px; color: #64748b;"></span>
        <button id="logout-btn" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">تسجيل الخروج</button>
      </div>
    </header>
    <div class="content-area" id="admin-main"></div>
  </main>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>

  <script src="../js/roles/admin/services.js"></script>
  <script src="../js/roles/admin/ui.js"></script>

  <script src="../js/roles/admin/tabs/users.js"></script>
  <script src="../js/roles/admin/tabs/parents.js"></script>
  <script src="../js/roles/admin/tabs/academic.js?v=academic-occupancy-1"></script>
  <script src="../js/roles/admin/tabs/classes.js"></script>
  <script src="../js/roles/admin/tabs/students.js"></script>
  <script src="../js/roles/admin/tabs/teachers.js"></script>
  <script src="../js/roles/admin/tabs/enrollments.js"></script>
  <script src="../js/roles/admin/tabs/attendance.js"></script>
  <script src="../js/roles/admin/tabs/schedules.js"></script>
  <script src="../js/roles/admin/tabs/assessments.js"></script> <script src="../js/roles/admin/tabs/grades.js"></script>
  <script src="../js/roles/admin/tabs/finance.js"></script>
  <script src="../js/roles/admin/tabs/fees.js"></script>
  <script src="../js/roles/admin/tabs/payments.js"></script>
  <script src="../js/roles/admin/tabs/transactions.js"></script>
  <script src="../js/roles/admin/tabs/resources.js"></script>
  <script src="../js/roles/admin/tabs/conversations.js?v=admin-conversations-1"></script>
  <script src="../js/roles/admin/tabs/notifications.js"></script>
  <script src="../js/roles/admin/tabs/posts.js"></script>
  <script src="../js/roles/admin/tabs/programs.js"></script>

  <script src="../js/roles/admin/role.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => { AdminRole.init(); });
  </script>
</body>
</html>
