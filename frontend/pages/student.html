<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الطالب — نظام إدارة المدرسة</title>
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/posts.css?v=posts-2">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div id="student-app">
    <header id="student-header"></header>
    <nav id="student-nav"></nav>
    <main id="student-main"></main>
  </div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/roles/student/services.js?v=schedule-time-1"></script>
  <script src="../js/roles/student/ui.js?v=schedule-time-1"></script>
  <script src="../js/roles/student/role.js?v=schedule-time-1"></script>

  <!-- Patch: inject data-icon onto nav buttons after renderNav() -->
  <script>
    const _ICON_MAP = {
      schedule:      '🗓',
      assessments:   '📝',
      grades:        '🏆',
      attendance:    '📋',
      resources:     '📚',
      posts:         '📰',
      fees:          '💳',
      notifications: '🔔',
    };

    if (Array.isArray(StudentUI.SECTIONS) && !StudentUI.SECTIONS.includes('posts')) {
      const resourcesIndex = StudentUI.SECTIONS.indexOf('resources');
      StudentUI.SECTIONS.splice(resourcesIndex + 1 || StudentUI.SECTIONS.length, 0, 'posts');
    }

    const _origRenderNav = StudentUI.renderNav.bind(StudentUI);
    StudentUI.renderNav = function(activeSection) {
      _origRenderNav(activeSection);
      document.querySelectorAll('.nav-btn[data-section]').forEach(btn => {
        const sec = btn.getAttribute('data-section');
        if (_ICON_MAP[sec]) btn.setAttribute('data-icon', _ICON_MAP[sec]);
      });
    };

    StudentRole.init();
  </script>
</body>
</html>
