<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الطالب — نظام إدارة المدرسة</title>
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div id="student-app">
    <header id="student-header"></header>
    <nav id="student-nav"></nav>
    <main id="student-main"></main>
  </div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/roles/student/services.js"></script>
  <script src="../js/roles/student/ui.js"></script>
  <script src="../js/roles/student/role.js"></script>

  <!-- Patch: inject data-icon onto nav buttons after renderNav() -->
  <script>
    const _ICON_MAP = {
      schedule:      '🗓',
      assessments:   '📝',
      grades:        '🏆',
      attendance:    '📋',
      resources:     '📚',
      fees:          '💳',
      notifications: '🔔',
    };

    const _origRenderNav = StudentUI.renderNav.bind(StudentUI);
    StudentUI.renderNav = function(activeSection) {
      _origRenderNav(activeSection);
      document.querySelectorAll('.nav-btn[data-section]').forEach(btn => {
        const sec = btn.getAttribute('data-section');
        if (_ICON_MAP[sec]) btn.setAttribute('data-icon', _ICON_MAP[sec]);
      });
    };

    StudentRole.init();
  </script>
</body>
</html>
