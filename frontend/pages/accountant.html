<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accounting and Finance System</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2" />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("accountant-theme");
        var theme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#0b1220" : "#0f766e");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/accountant.css?v=accountant-theme-1">
  </head>
<body class="accountant-shell">
  <div id="accountant-app" style="display: flex; flex-direction: column; min-height: 100vh;">
    <header id="accountant-header"></header>
    <nav id="accountant-nav"></nav>
    <main id="accountant-main" style="flex: 1;"></main>
  </div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/i18n.js?v=accountant-i18n-1"></script>

  <script src="../js/roles/accountant/services.js?v=accountant-i18n-1"></script>
  <script src="../js/roles/accountant/ui.js?v=accountant-theme-1"></script>
  
  <script src="../js/roles/accountant/tabs/students.js?v=accountant-theme-1"></script>
  <script src="../js/roles/accountant/tabs/fees.js?v=accountant-theme-1"></script>
  <script src="../js/roles/accountant/tabs/payments.js?v=accountant-theme-1"></script>
  <script src="../js/roles/accountant/tabs/transactions.js?v=accountant-theme-1"></script>

  <script src="../js/roles/accountant/tabs/search.js?v=accountant-theme-1"></script>
  <script src="../js/roles/accountant/tabs/attendance.js?v=accountant-theme-1"></script>

  <script src="../js/roles/accountant/role.js?v=accountant-theme-1"></script>
  <script>
    AccountantRole.init();
  </script>
</body>
</html>
