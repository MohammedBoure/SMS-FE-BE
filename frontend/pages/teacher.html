<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الأستاذ — نظام إدارة المدرسة</title>
  <link rel="stylesheet" href="../css/teacher.css?v=teacher-messages-1">
  <link rel="stylesheet" href="../css/posts.css?v=teacher-posts-1">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div id="teacher-app">
    <header id="teacher-header"></header>
    <nav id="teacher-nav"></nav>
    <main id="teacher-main"></main>
  </div>

  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/roles/teacher/services.js?v=teacher-messages-1"></script>
  <script src="../js/roles/teacher/ui.js?v=teacher-messages-1"></script>
  <script src="../js/roles/teacher/role.js?v=teacher-messages-1"></script>

  <script>
    /* ── Patch: inject nav icons & fix header inline styles ── */
    const _ICONS = {
      assignments:   '🏫',
      schedule:      '🗓',
      attendance:    '📋',
      grades:        '🏆',
      resources:     '📚',
      posts:         '📰',
      messages:      '✉',
      notifications: '🔔',
    };

    /* Patch renderNav to add icon spans */
    const _origNav = TeacherUI.renderNav.bind(TeacherUI);
    TeacherUI.renderNav = function(activeSection) {
      _origNav(activeSection);
      document.querySelectorAll('#teacher-nav .nav-btn[data-section]').forEach(btn => {
        const sec = btn.getAttribute('data-section');
        if (!btn.querySelector('.nav-icon') && _ICONS[sec]) {
          const icon = document.createElement('span');
          icon.className = 'nav-icon';
          icon.textContent = _ICONS[sec];
          btn.prepend(icon);
          /* remove inline margin/padding added by JS */
          btn.style.cssText = '';
        }
      });
    };

    /* Patch renderHeader to strip inline background/color */
    const _origHeader = TeacherUI.renderHeader.bind(TeacherUI);
    TeacherUI.renderHeader = function(session, teacherData) {
      _origHeader(session, teacherData);
      const inner = document.querySelector('#teacher-header > div');
      if (inner) inner.style.cssText = '';
      const h1 = document.querySelector('#teacher-header h1');
      if (h1) {
        /* Wrap name in strong for colour accent */
        h1.innerHTML = h1.innerHTML.replace(
          /مرحباً أستاذ\(ة\):\s*(.+)/,
          'مرحباً، الأستاذ(ة) <strong>$1</strong>'
        );
      }
    };

    TeacherRole.init();
  </script>
</body>
</html>
